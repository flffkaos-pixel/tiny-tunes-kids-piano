<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
.fg{width:1024px;height:500px;background:linear-gradient(120deg,#FFF7AD 0%,#FFD1DC 50%,#C5E8FF 100%);display:flex;align-items:center;padding:0 70px;font-family:'Baloo 2','Comic Sans MS',sans-serif;overflow:hidden}
.left{flex:1}
.left h1{font-size:92px;color:#FF6B9D;text-shadow:4px 4px 0 #fff;line-height:1}
.left p{font-size:34px;color:#4A4A4A;margin-top:10px;font-weight:bold}
.badges{margin-top:18px;display:flex;gap:12px}
.badges span{background:#fff;border-radius:999px;padding:8px 22px;font-size:22px;font-weight:bold;color:#FF6B9D;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.right{width:380px;height:100%;position:relative}
.keys{position:absolute;right:0;top:60px;display:flex}
.wk{width:56px;height:340px;background:#fff;border:3px solid #eee;border-radius:0 0 14px 14px;margin:0 3px}
.bk{position:absolute;top:0;width:38px;height:200px;background:#333;border-radius:0 0 9px 9px}
.star{position:absolute;font-size:54px}
</style></head><body><div class="fg">
<div class="left">
<h1>Tiny Tunes</h1>
<p>Kids Piano &bull; Ages 1&ndash;6</p>
<div class="badges"><span>23 Songs</span><span>4 Instruments</span><span>12 Animals</span></div>
</div>
<div class="right">
<div class="keys">
<div class="wk"></div><div class="wk"></div><div class="wk"></div><div class="wk"></div><div class="wk"></div>
<div class="bk" style="left:52px"></div><div class="bk" style="left:114px"></div><div class="bk" style="left:238px"></div><div class="bk" style="left:300px"></div>
</div>
<div class="star" style="left:10px;top:40px">&#11088;</div>
<div class="star" style="right:20px;bottom:50px">&#127925;</div>
</div>
</div></body></html>
