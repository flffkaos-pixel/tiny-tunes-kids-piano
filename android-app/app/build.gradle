plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tinytunes.kidspiano'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tinytunes.kidspiano'
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName '1.0.5'
    }

    signingConfigs {
        release {
            storeFile file(findProperty('RELEASE_STORE_FILE') ?: '../release.keystore')
            storePassword findProperty('RELEASE_STORE_PASSWORD')
            keyAlias findProperty('RELEASE_KEY_ALIAS')
            keyPassword findProperty('RELEASE_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // AdMob for kids (Families Policy: certified SDK, G-rated non-personalized ads only)
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
}
