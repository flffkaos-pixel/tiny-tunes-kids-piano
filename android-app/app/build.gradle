plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tinytunes.kidspiano'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tinytunes.kidspiano'
        minSdk 24
        targetSdk 36
        versionCode 7
        versionName '1.0.6'
    }

    signingConfigs {
        release {
            storeFile file(findProperty('RELEASE_STORE_FILE') ?: '../release.keystore')
            storePassword findProperty('RELEASE_STORE_PASSWORD')
            keyAlias findProperty('RELEASE_KEY_ALIAS')
            keyPassword findProperty('RELEASE_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // AdMob for kids (Families Policy: certified SDK, G-rated non-personalized ads only)
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    constraints {
        // Play Console flags fragment:1.0.0 as outdated - force latest stable
        implementation('androidx.fragment:fragment:1.9.1') {
            because 'Play Console outdated-SDK warning on fragment:1.0.0'
        }
    }
}
