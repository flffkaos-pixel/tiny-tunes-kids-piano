<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
body{font-family:sans-serif;background:#F5F5F5;margin:0;padding:24px;color:#4A4A4A}
h1{font-size:24px}h2{font-size:17px;margin:26px 0 10px;color:#FF6B9D}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:6px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
img{display:block;max-width:100%}
.zoo{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.zoo img{width:100%;height:auto}
.note{font-size:13px;color:#999}
</style></head><body>
<h1>Tiny Tunes — Figma asset preview</h1>
<p class="note">KidsPiano/design/ · drag each SVG into Figma</p>
<h2>Logo</h2><div class="card"><img src="logo.svg" style="width:360px"></div>
<h2>Tabs</h2><div class="card"><img src="tabs.svg" style="width:486px"></div>
<h2>Instruments</h2><div class="card"><img src="instruments.svg" style="width:474px"></div>
<h2>Buttons</h2><div class="card"><img src="buttons.svg" style="width:494px"></div>
<h2>Keys + Sparkles</h2><div class="card"><img src="keys.svg" style="width:230px"><br><img src="stars.svg" style="width:340px"></div>
<h2>Animals (12)</h2><div class="card zoo">
<img src="animals/animal-dog.svg"><img src="animals/animal-cat.svg"><img src="animals/animal-cow.svg"><img src="animals/animal-sheep.svg">
<img src="animals/animal-pig.svg"><img src="animals/animal-chicken.svg"><img src="animals/animal-duck.svg"><img src="animals/animal-frog.svg">
<img src="animals/animal-lion.svg"><img src="animals/animal-elephant.svg"><img src="animals/animal-monkey.svg"><img src="animals/animal-bird.svg">
</div></body></html>
